name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - run: bun test
      - run: bun run typecheck

      # npm 11.5.1+ / node >= 22.14 are required for OIDC trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Authenticates via GitHub OIDC — no token. The package must already
      # exist and have this repository/workflow configured as a trusted
      # publisher. Provenance is omitted for private repositories.
      - run: npm publish
