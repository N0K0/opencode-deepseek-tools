name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - run: bun test
      - run: bun run typecheck

      # npm 11.5.1+ / node >= 22.14 are required for OIDC trusted publishing.
      # Omit registry-url: it writes an empty _authToken line that prevents
      # npm from falling back to OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      # First publish only. npm requires a package to already exist before a
      # trusted publisher can be attached, so the bootstrap release uses the
      # NPM_TOKEN secret. Remove the secret after configuring the trusted
      # publisher; when it is absent, npm authenticates via GitHub OIDC.
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "Publishing with NPM_TOKEN (first-publish bootstrap)."
          else
            echo "Publishing with GitHub OIDC trusted publishing."
          fi

      - name: Check whether this version is already published
        id: version
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          if npm view "@hacky.software/opencode-deepseek-tools@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already on the registry; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.exists != 'true'
        run: npm publish
